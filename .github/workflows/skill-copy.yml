name: Skill copy

# Skill.md at the repository root serves the download links and older install
# instructions; the plugin loads skills/seo-utils-mcp-guide/SKILL.md. Both must
# say the same thing.
on:
  push:
  pull_request:

jobs:
  identical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skill.md matches the plugin's SKILL.md
        run: |
          if ! cmp -s Skill.md skills/seo-utils-mcp-guide/SKILL.md; then
            echo "::error file=Skill.md::Skill.md differs from skills/seo-utils-mcp-guide/SKILL.md. Edit the plugin's SKILL.md, then copy it: cp skills/seo-utils-mcp-guide/SKILL.md Skill.md"
            diff -u skills/seo-utils-mcp-guide/SKILL.md Skill.md || true
            exit 1
          fi
